version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: secure-notes-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    container_name: secure-notes-server
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://db:27017/secure-notes
      - JWT_SECRET=supersecurejwtsecretkeyforyou
      - JWT_REFRESH_SECRET=evenmoresecurerefreshsecretkeyforyou
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - db

  client:
    build: ./client
    container_name: secure-notes-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mongo_data:
